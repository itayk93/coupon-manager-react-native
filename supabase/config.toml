project_id = "dugjsiyenazpsoiyduuz"

# Every Edge Function is listed explicitly, and verify_jwt is stated even where
# it matches the default. The failure mode this prevents is a new function
# being added, deployed with --no-verify-jwt "just to get it working", and
# quietly becoming a public endpoint holding the service role key.
#
# Rule: verify_jwt = false requires a comment saying what authenticates the
# caller instead. If there is no answer, it must be true.
#
# NOTE: deploying a function applies its setting here. The three marked
# "needs client check" are currently deployed without JWT verification; flipping
# them requires confirming the caller always has a session first.

[functions.legacy-login]
# Public by necessity: this is the endpoint that establishes a session.
# Protected by the Werkzeug hash check and a uniform error for unknown emails.
verify_jwt = false

[functions.manage-unsubscribe]
# Public by necessity: reached from an email link, before login.
# Authenticated by an HMAC token signed with UNSUBSCRIBE_SECRET.
verify_jwt = false

[functions.manage-user-tour]
verify_jwt = true

[functions.trigger-multipass-update]
verify_jwt = true

[functions.multipass-daily-codes]
# Called by the CI scraper. Authentication is enforced inside the function
# with MULTIPASS_CRON_TOKEN; no user JWT is available to the scheduled job.
verify_jwt = false

[functions.coupon-vault]
verify_jwt = true

[functions.search-coupon-merchants]
# Paid OpenAI web search. The function also enforces user_id=1 internally.
verify_jwt = true

[functions.update-balance]
verify_jwt = true

[functions.push-notifications]
verify_jwt = true

[functions.parse-coupon]
# All callers are behind PrivateRoute, and the function calls requireUser()
# itself so the OpenAI spend is always attributable to a real account.
verify_jwt = true

[functions.parse-usage-screenshot]
# Auth is also checked inside the function before any paid AI request.
verify_jwt = true

[functions.send-emails]
# Cannot be true: the issue_report mode is reached from /issues, a public
# route. Authorisation is per-mode inside the function — newsletter and test
# require requireAdmin(); issue_report is public but only ever mails the site
# owner.
verify_jwt = false

[functions.send-expiry-alerts]
# Cannot be true: pg_cron has no JWT to present, it authenticates with the
# EXPIRY_CRON_TOKEN header instead. The function admits nobody else — a caller
# without that token must pass requireAdmin() or be the service role.
verify_jwt = false

[functions.log-activity]
# What the user did and which screens they opened. The account, IP and device
# are taken from the request, never from the body, which is the reason this is
# a function and not an insert from the app.
verify_jwt = true

[functions.send-engagement-alerts]
# Cannot be true, for the same reason as send-expiry-alerts: pg_cron has no JWT
# to present and authenticates with the cron-token header instead. Left at the
# default, the platform rejects the cron call with a 401 before the function
# runs at all — which is exactly what happened the first time this deployed.
verify_jwt = false

[functions.notify-event]
# The app tells the server what just happened; the server checks the claim
# against the coupon before saying anything about it. A caller without a session
# has nothing to report.
verify_jwt = true

[functions.send-verification-code]
# Public by necessity: it is what a person calls while creating an account, so
# there is no session to present yet. It hands back nothing but {sent:true} —
# never the code — and Auth still rate-limits how often a fresh one is minted.
verify_jwt = false

[functions.send-password-reset]
# Public by necessity: a person who cannot sign in is the only one who needs
# it. Nothing is returned either way, so it cannot be used to ask whether an
# address has an account, and redirect_to is matched against a fixed list so
# the link it mails can only ever land on our own reset screen.
verify_jwt = false

[functions.claim-referral]
# The account being attributed comes from the JWT. Without verification the
# body would be the only thing saying who is being added to a partner's chain,
# and that partner is paid per user.
verify_jwt = true

# TOTP is what the admin panel asks for before it will draw anything. Stated
# here so a local stack behaves like production instead of failing enrollment
# with an unexplained error.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
