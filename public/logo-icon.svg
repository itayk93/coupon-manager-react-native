<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Ticket Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <!-- Crown / Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Coupon Notches -->
  <g filter="url(#shadow)">
    <!-- Ticket Body path with left and right semicircle notches -->
    <path d="
      M 96,64 
      H 416 
      A 32,32 0 0,1 448,96 
      V 224 
      A 32,32 0 0,0 448,288 
      V 416 
      A 32,32 0 0,1 416,448 
      H 96 
      A 32,32 0 0,1 64,416 
      V 288 
      A 32,32 0 0,0 64,224 
      V 96 
      A 32,32 0 0,1 96,64 Z
    " fill="url(#bgGrad)" />

    <!-- Dashed separator line -->
    <line x1="100" y1="340" x2="412" y2="340" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="12 10" />

    <!-- Crown Icon in Center Top -->
    <path d="
      M 160 270 
      L 180 180 
      L 225 220 
      L 256 150 
      L 287 220 
      L 332 180 
      L 352 270 
      Z
    " fill="url(#goldGrad)" />
    
    <!-- Crown Jewels / Circles -->
    <circle cx="180" cy="170" r="10" fill="#FDE68A" />
    <circle cx="256" cy="140" r="12" fill="#FDE68A" />
    <circle cx="332" cy="170" r="10" fill="#FDE68A" />

    <!-- Sparkling Star emblem -->
    <path d="M 256 200 L 263 223 L 286 230 L 263 237 L 256 260 L 249 237 L 226 230 L 249 223 Z" fill="#FFFFFF" />

    <!-- Barcode lines at bottom of coupon -->
    <rect x="130" y="370" width="12" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="154" y="370" width="6" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="172" y="370" width="18" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="202" y="370" width="10" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="224" y="370" width="6" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="242" y="370" width="22" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="276" y="370" width="10" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="298" y="370" width="16" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="326" y="370" width="8" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="346" y="370" width="20" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="378" y="370" width="6" height="40" rx="3" fill="#FFFFFF" fill-opacity="0.8" />
  </g>
</svg>